[tool.poetry]
name = "libshipkore"
version = "0.5.0"
description = ""
authors = ["Gagandeep Singh <gagan@innerkore.com>"]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.27.1"
beautifulsoup4 = "^4.10.0"
python-dateutil = "^2.8.2"
click = "^8.0.3"
pydantic = "^2.12"
parsel = "^1.6.0"
# optional features, installed with e.g. pip install "libshipkore[mcp]"
mcp = {version = ">=2.3,<3", optional = true}
sqlalchemy = {version = ">=1.4", optional = true}
boto3 = {version = ">=1.26", optional = true}
playwright = {version = ">=1.40", optional = true}

[tool.poetry.extras]
mcp = ["mcp"]
sql = ["sqlalchemy"]
s3 = ["boto3"]
browser = ["playwright"]

[tool.poetry.scripts]
libshipkore = "libshipkore.cli:main"
libshipkore-mcp = "libshipkore.mcp_server.__main__:main"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
